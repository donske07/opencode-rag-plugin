services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data

volumes:
  rag-postgres-data:
